<!doctype html>
<html lang="en" data-theme="cupcake">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K-Assistant</title>

    <!-- 防止出現 favion.ico 錯誤 -->
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgo=">

    <style>
      .mask-glowing-red {
        font-size: 100px;
        color: #fff;
        animation: glow-red 1s ease-in-out infinite alternate;
      }

      .mask-glowing-green {
        font-size: 100px;
        color: #fff;
        animation: glow-green 1s ease-in-out infinite alternate;
      }

      .mask-glowing-blue {
        font-size: 100px;
        color: #fff;
        animation: glow-blue 1s ease-in-out infinite alternate;
      }

      @keyframes glow-red {
        from {
          text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #e60073;
        }
        to {
          text-shadow: 0 0 20px #fff, 0 0 30px #ff4da6, 0 0 40px #ff4da6;
        }
      }

      @keyframes glow-green {
        from {
          text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #009900;
        }
        to {
          text-shadow: 0 0 20px #fff, 0 0 30px #00ff00, 0 0 40px #00ff00;
        }
      }

      @keyframes glow-blue {
        from {
          text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #0066ff;
        }
        to {
          text-shadow: 0 0 20px #fff, 0 0 30px #66a3ff, 0 0 40px #66a3ff;
        }
      }

    </style>
